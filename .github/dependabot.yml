version: 2
updates:
  - package-ecosystem: pip
    directory: /server
    schedule: { interval: weekly }
  - package-ecosystem: gomod
    directory: /worker
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /console
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directories: [/server, /worker, /console]
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
