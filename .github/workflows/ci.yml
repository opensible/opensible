name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-tests:
    name: Server (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        env:
          JWT_SECRET_KEY: ci-jwt-secret-key-at-least-32-chars-long!!
          GLOBAL_SECRETS_ENCRYPTION_KEY: ci-global-secrets-encryption-key-32b
          INTERNAL_CALL_SECRET: ci-internal-call-secret-at-least-32-chars
          FLASK_ENV: testing
        run: pytest

  worker-tests:
    name: Worker (go test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: worker/go.mod
          cache-dependency-path: worker/go.sum

      - name: Run unit tests
        run: go test ./...

  console-build:
    name: Console (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Production build
        run: bun run build
