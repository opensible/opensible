name: Lint

# Lint steps are advisory for now: findings show in the job log but never fail
# the PR. Remove continue-on-error on a step once that component is clean.
# The image smoke build IS blocking: it proves all three Dockerfiles still build.

on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-ruff:
    name: Server (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/ruff-action@v3
        continue-on-error: true
        with:
          src: server

  worker-vet:
    name: Worker (go vet + gofmt)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: worker/go.mod
          cache-dependency-path: worker/go.sum
      - run: go vet ./...
        continue-on-error: true
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
        continue-on-error: true

  console-lint:
    name: Console (eslint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint --if-present || bunx eslint .
        continue-on-error: true

  image-smoke:
    name: Image build (smoke)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [server, worker, console]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          # Dockerfiles expect the repo root as build context (they COPY IaC/).
          context: .
          file: ${{ matrix.component }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.component }}
