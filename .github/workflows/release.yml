name: Release images

# Builds and publishes multi-arch images to GHCR when a component tag is pushed:
#   v0.1.6-worker        -> ghcr.io/<owner>/opensible-worker:0.1.6 (+ latest)
#   v0.1.9-server        -> ghcr.io/<owner>/opensible-server:0.1.9 (+ latest)
#   web-console-0.1.14   -> ghcr.io/<owner>/opensible-console:0.1.14 (+ latest)
# Also runnable manually from the Actions tab.

on:
  push:
    tags:
      - "v*-worker"
      - "v*-server"
      - "web-console-*"
  workflow_dispatch:
    inputs:
      component:
        description: "Component to release"
        required: true
        type: choice
        options: [server, worker, console]
      version:
        description: "Version (e.g. 0.1.9)"
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      component: ${{ steps.r.outputs.component }}
      version: ${{ steps.r.outputs.version }}
    steps:
      - id: r
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            c="${{ inputs.component }}"; v="${{ inputs.version }}"
          else
            t="${GITHUB_REF_NAME}"
            case "$t" in
              web-console-*) c=console; v="${t#web-console-}" ;;
              v*-worker)     c=worker;  v="${t#v}"; v="${v%-worker}" ;;
              v*-server)     c=server;  v="${t#v}"; v="${v%-server}" ;;
              *) echo "Unknown tag $t"; exit 1 ;;
            esac
          fi
          echo "component=$c" >> "$GITHUB_OUTPUT"
          echo "version=$v"   >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/opensible-${{ needs.resolve.outputs.component }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ needs.resolve.outputs.version }}
            type=raw,value=latest

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ needs.resolve.outputs.component }}
          file: ${{ needs.resolve.outputs.component }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ needs.resolve.outputs.component }}
          cache-to: type=gha,mode=max,scope=${{ needs.resolve.outputs.component }}

      - uses: sigstore/cosign-installer@v3
      - name: Sign image (keyless)
        run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"

      - uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ needs.resolve.outputs.component }}.spdx.json

      - name: Draft GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: sbom-${{ needs.resolve.outputs.component }}.spdx.json
