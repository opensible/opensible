id: elasticsearch-cluster
name: Elasticsearch HA (Docker cluster)
group: databases
description: >-
  Production Elasticsearch cluster across N nodes running the official Elasticsearch Docker image. Each node runs one
  container managed by a dedicated systemd unit; cluster formation via discovery.seed_hosts and
  cluster.initial_master_nodes. Ships with a per-node HTTP health dashboard (green/yellow/red + shard summary).
logo: https://cdn.simpleicons.org/elasticsearch/005571
tags:
  - elasticsearch
  - elastic
  - docker
  - cluster
  - ha
  - search
author: opensible
stars: 34
source: https://github.com/opensible/opensible/tree/main/IaC/blueprints/databases/elasticsearch-cluster
available: true
templateId: elasticsearch-cluster
filenameStem: elasticsearch-cluster
entrypoint: playbook.yml
requires:
  ansible: '>=2.14'
defaults:
  cluster_id: opensible-es
  es_version: 8.15.3
  http_port: 9200
  transport_port: 9300
  announce_host: '{{ ansible_host | default(inventory_hostname) }}'
  health_http_enabled: true
  health_http_port: 9280
  security_enabled: false
  elastic_password: ''
  heap_size: 1g
  data_dir: /var/lib/elasticsearch-data
  ssh_user_default: root
  ssh_port_default: 22
  nodes:
    - name: es-1
      ip: ''
      ssh_user: ''
      ssh_port: ''
    - name: es-2
      ip: ''
      ssh_user: ''
      ssh_port: ''
    - name: es-3
      ip: ''
      ssh_user: ''
      ssh_port: ''
  open_firewall: true
  become: true
category: Search & Analytics
