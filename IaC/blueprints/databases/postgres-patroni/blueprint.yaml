id: postgres-ha
name: PostgreSQL HA (Patroni + etcd)
group: databases
description: >-
  3-node PostgreSQL HA cluster managed by Patroni with an embedded etcd v3 DCS. Installs PostgreSQL from PGDG, runs
  Patroni from a pinned Python venv, and manages everything via systemd. First node is the initial leader; use 3+ nodes
  for real HA.
logo: https://cdn.simpleicons.org/postgresql/4169E1
tags:
  - postgres
  - patroni
  - etcd
  - ha
  - systemd
author: opensible
stars: 112
source: https://github.com/opensible/opensible/tree/main/IaC/blueprints/databases/postgres-patroni
available: true
templateId: postgres-patroni
filenameStem: postgres-patroni-cluster
entrypoint: playbook.yml
requires:
  ansible: '>=2.14'
defaults:
  cluster_id: opensible-pg
  pg_version: '16'
  ssh_user_default: root
  ssh_port_default: 22
  nodes:
    - name: pg-1
      ip: ''
      ssh_user: ''
      ssh_port: ''
    - name: pg-2
      ip: ''
      ssh_user: ''
      ssh_port: ''
    - name: pg-3
      ip: ''
      ssh_user: ''
      ssh_port: ''
  listen_address: 0.0.0.0
  pg_port: 5432
  patroni_rest_port: 8008
  etcd_client_port: 2379
  etcd_peer_port: 2380
  synchronous_mode: false
  maximum_lag_on_failover: 1048576
  ttl: 30
  loop_wait: 10
  retry_timeout: 10
  max_connections: 200
  shared_buffers: 256MB
  wal_level: replica
  etcd_version: 3.5.16
  patroni_version: 3.3.2
  open_firewall: true
  become: true
category: Relational Databases
