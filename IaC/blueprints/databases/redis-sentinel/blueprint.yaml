id: redis-sentinel
name: Redis + Sentinel
group: databases
description: >-
  Redis primary/replica with Sentinel for automatic failover. Distro packages + systemd — no Docker, no Bitnami. First
  node is the initial primary; add 3+ nodes for real HA.
logo: https://cdn.simpleicons.org/redis/DC382D
tags:
  - redis
  - sentinel
  - ha
  - systemd
author: opensible
stars: 47
source: https://github.com/opensible/opensible/tree/main/IaC/blueprints/databases/redis-sentinel
available: true
templateId: redis-sentinel
filenameStem: redis-sentinel-cluster
entrypoint: playbook.yml
requires:
  ansible: '>=2.14'
defaults:
  flavor: redis
  cluster_id: opensible-redis
  primary_name: mymaster
  bind: 0.0.0.0
  port: 6379
  sentinel_port: 26379
  quorum: 2
  down_after_ms: 5000
  failover_timeout_ms: 10000
  parallel_syncs: 1
  maxmemory: ''
  maxmemory_policy: noeviction
  appendonly: true
  requirepass: ''
  ssh_user_default: root
  ssh_port_default: 22
  nodes:
    - name: redis-1
      ip: ''
      ssh_user: ''
      ssh_port: ''
    - name: redis-2
      ip: ''
      ssh_user: ''
      ssh_port: ''
    - name: redis-3
      ip: ''
      ssh_user: ''
      ssh_port: ''
  open_firewall: true
  become: true
category: Cache & KV
