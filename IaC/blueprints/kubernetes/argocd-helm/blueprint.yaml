id: helm-argocd
name: Argo CD via Helm
group: kubernetes
description: Install Argo CD on any cluster using the official argo-helm chart.
logo: https://cdn.simpleicons.org/argo/EF7B4D
tags:
  - gitops
  - argocd
  - helm
author: opensible
stars: 71
source: https://github.com/opensible/opensible/tree/main/IaC/blueprints/kubernetes/argocd-helm
available: true
templateId: k8s-manifests
filenameStem: argocd-helm
entrypoint: playbook.yml
requires:
  ansible: '>=2.14'
  helm: '>=3.12'
defaults:
  action: helm
  helm_release: argocd
  helm_chart: argo/argo-cd
  helm_repo_name: argo
  helm_repo_url: https://argoproj.github.io/argo-helm
  helm_version: ''
  namespace: argocd
  create_namespace: true
  helm_wait: true
  kubeconfig: ''
  helm_values: |
    global:
      domain: argocd.example.com
    server:
      service:
        type: ClusterIP
      ingress:
        enabled: false
    configs:
      params:
        server.insecure: "true"
    dex:
      enabled: false
    notifications:
      enabled: false
category: Kubernetes
