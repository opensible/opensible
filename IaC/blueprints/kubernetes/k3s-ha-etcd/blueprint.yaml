id: k3s-ha-etcd
name: k3s HA (embedded etcd)
group: kubernetes
description: Lightweight k3s cluster with embedded etcd and Longhorn storage.
logo: https://cdn.simpleicons.org/k3s/FFC61C
tags:
  - k3s
  - edge
  - longhorn
author: opensible
stars: 96
source: https://github.com/opensible/opensible/tree/main/IaC/blueprints/kubernetes/k3s-ha-etcd
available: true
templateId: k3s-bootstrap
filenameStem: k3s-ha-etcd
entrypoint: playbook.yml
requires:
  ansible: '>=2.14'
defaults:
  cluster_name: opensible-k3s
  cluster_token: change-me-please
  k3s_version: stable
  ha_mode: false
  disable_traefik: true
  install_longhorn: false
  servers:
    - name: k3s-server-1
      ip: 10.0.0.10
  agents:
    - name: k3s-agent-1
      ip: 10.0.0.20
category: Kubernetes
