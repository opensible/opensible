id: kafka-kraft
name: Apache Kafka (KRaft Cluster)
group: messaging
description: >-
  Apache Kafka in KRaft mode on systemd (no ZooKeeper, no Docker, no Bitnami). Node IDs, quorum voters and advertised
  listeners are computed from the inventory.
logo: https://cdn.simpleicons.org/apachekafka/231F20
tags:
  - kafka
  - kraft
  - systemd
  - streaming
author: opensible
stars: 76
source: https://github.com/opensible/opensible/tree/main/IaC/blueprints/messaging/kafka-kraft
available: true
templateId: kafka-cluster
filenameStem: kafka-kraft-cluster
entrypoint: playbook.yml
requires:
  ansible: '>=2.14'
defaults:
  cluster_id: opensible-kafka
  kafka_version: 3.8.1
  kafka_scala_version: '2.13'
  client_port: 9092
  controller_port: 9093
  replication_factor: 3
  min_insync_replicas: 2
  num_partitions: 6
  auto_create_topics: false
  log_retention_hours: 168
  heap_opts: -Xms1G -Xmx1G
  install_dir: /opt/kafka
  data_dir: /var/lib/kafka/data
  log_dir: /var/log/kafka
  ssh_user_default: root
  ssh_port_default: 22
  brokers:
    - name: kafka-1
      ip: ''
      ssh_user: ''
      ssh_port: ''
    - name: kafka-2
      ip: ''
      ssh_user: ''
      ssh_port: ''
    - name: kafka-3
      ip: ''
      ssh_user: ''
      ssh_port: ''
  open_firewall: true
  become: true
category: Streaming
