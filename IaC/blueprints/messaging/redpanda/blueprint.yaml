id: redpanda-cluster
name: Redpanda Cluster (Self-Managed) + Console
group: messaging
description: >-
  Kafka-API-compatible Redpanda Self-Managed cluster on systemd (no ZooKeeper, no JVM, no Docker). Seed servers and
  advertised listeners are computed from the inventory. Redpanda Console (web UI) is deployed on the first broker.
logo: https://cdn.simpleicons.org/redpanda/E9165A
tags:
  - redpanda
  - kafka-api
  - systemd
  - streaming
  - console
author: opensible
stars: 32
source: https://github.com/opensible/opensible/tree/main/IaC/blueprints/messaging/redpanda
available: true
templateId: redpanda-cluster
filenameStem: redpanda-cluster
entrypoint: playbook.yml
requires:
  ansible: '>=2.14'
defaults:
  cluster_id: opensible-redpanda
  redpanda_channel: redpanda
  kafka_port: 9092
  rpc_port: 33145
  admin_port: 9644
  schema_registry_port: 8081
  pandaproxy_port: 8082
  console_enabled: true
  console_port: 8080
  developer_mode: false
  seastar_smp: 0
  seastar_memory: '0'
  data_dir: /var/lib/redpanda/data
  ssh_user_default: root
  ssh_port_default: 22
  brokers:
    - name: redpanda-1
      ip: ''
      ssh_user: ''
      ssh_port: ''
    - name: redpanda-2
      ip: ''
      ssh_user: ''
      ssh_port: ''
    - name: redpanda-3
      ip: ''
      ssh_user: ''
      ssh_port: ''
  open_firewall: true
  become: true
category: Streaming
