id: vault-cluster
name: HashiCorp Vault HA (Docker cluster)
group: security
description: >-
  Production HashiCorp Vault HA cluster across N nodes running the official hashicorp/vault Docker image with integrated
  Raft storage. Each node runs one container managed by a dedicated systemd unit (vault-docker.service); followers
  auto-join via retry_join, and optional first-run auto-init + persistent auto-unseal keep the cluster unsealed across
  reboots.
logo: https://cdn.simpleicons.org/vault/FFEC6E
tags:
  - vault
  - hashicorp
  - secrets
  - docker
  - cluster
  - ha
  - raft
author: opensible
stars: 12
source: https://github.com/opensible/opensible/tree/main/IaC/blueprints/security/vault-cluster
available: true
templateId: vault-cluster
filenameStem: vault-cluster
entrypoint: playbook.yml
requires:
  ansible: '>=2.14'
defaults:
  cluster_id: opensible-vault
  ssh_user_default: root
  ssh_port_default: 22
  nodes:
    - name: vault-1
      ip: ''
      ssh_user: ''
      ssh_port: ''
    - name: vault-2
      ip: ''
      ssh_user: ''
      ssh_port: ''
    - name: vault-3
      ip: ''
      ssh_user: ''
      ssh_port: ''
  vault_version: 1.18.1
  api_port: 8200
  cluster_port: 8201
  api_address: ''
  cluster_address: ''
  tls_disable: true
  tls_cert_file: /etc/vault/tls/tls.crt
  tls_key_file: /etc/vault/tls/tls.key
  data_dir: /var/lib/vault-data
  ui: true
  disable_mlock: true
  log_level: info
  auto_init: true
  health_http_enabled: true
  health_http_port: 8280
  open_firewall: true
  become: true
category: Secrets
