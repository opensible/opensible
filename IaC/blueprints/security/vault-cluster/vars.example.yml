# Example vars for vault-cluster
cluster_id: opensible-vault
vault_version: "1.18.1"

# 3 or 5 nodes recommended for real Raft HA. First node bootstraps the cluster.
nodes:
  - { name: vault-1, ip: 10.0.0.11, ssh_user: root, ssh_port: 22 }
  - { name: vault-2, ip: 10.0.0.12, ssh_user: root, ssh_port: 22 }
  - { name: vault-3, ip: 10.0.0.13, ssh_user: root, ssh_port: 22 }

api_port: 8200
cluster_port: 8201

# Dev only — set to false and provide certs to enable TLS.
tls_disable: true
tls_cert_file: /etc/vault/tls/tls.crt
tls_key_file: /etc/vault/tls/tls.key

data_dir: /var/lib/vault-data
ui: true
disable_mlock: true
log_level: info

# Auto-init on the first node, distribute unseal keys, install
# vault-autounseal.service + .timer on every node.
auto_init: true

open_firewall: true
become: true
