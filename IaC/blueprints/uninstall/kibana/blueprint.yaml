id: uninstall-kibana
name: Uninstall — Kibana (Docker cluster)
group: uninstall
description: >-
  Stop kibana-docker.service on every node, remove the Kibana container and image, delete /var/lib/kibana and the
  per-node health dashboard unit.
logo: https://cdn.simpleicons.org/kibana/005571
tags:
  - cleanup
  - kibana
  - elastic
  - docker
author: opensible
stars: 3
available: true
templateId: uninstall-stack
filenameStem: uninstall-kibana
entrypoint: playbook.yml
defaults:
  stack: kibana
  purge_data: true
  remove_packages: true
  flush_iptables: false
  reboot_after: false
  become: true
