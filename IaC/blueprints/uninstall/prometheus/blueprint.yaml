id: uninstall-prometheus
name: Uninstall — Prometheus (systemd)
group: uninstall
description: >-
  Stop prometheus.service, remove /usr/local/bin/{prometheus,promtool}, /etc/prometheus, /srv/metrics and the prometheus
  system user.
logo: https://cdn.simpleicons.org/prometheus/E6522C
tags:
  - cleanup
  - prometheus
  - metrics
author: opensible
stars: 3
available: true
templateId: uninstall-stack
filenameStem: uninstall-prometheus
entrypoint: playbook.yml
defaults:
  stack: prometheus
  purge_data: true
  remove_packages: false
  flush_iptables: false
  reboot_after: false
  become: true
