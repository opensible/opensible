id: uninstall-vault-cluster
name: Uninstall — HashiCorp Vault (Docker cluster)
group: uninstall
description: >-
  Stop vault-docker.service and the vault-autounseal service/timer on every node, remove the Vault container and image,
  and purge /etc/vault, /opt/vault and the Raft data directory (/var/lib/vault-data).
logo: https://cdn.simpleicons.org/vault/FFEC6E
tags:
  - cleanup
  - vault
  - hashicorp
  - docker
author: opensible
stars: 3
available: true
templateId: uninstall-stack
filenameStem: uninstall-vault-cluster
entrypoint: playbook.yml
defaults:
  stack: vault-cluster
  purge_data: true
  remove_packages: true
  flush_iptables: false
  reboot_after: false
  become: true
