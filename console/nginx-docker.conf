server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve upstream at request time so nginx does not crash if the backend
    # is not up yet, and any service name (backend, opensible-backend, ...) works.
    resolver 127.0.0.11 ipv6=off valid=10s;

    client_max_body_size 50m;

    location /api/ {
        set $backend_upstream "${BACKEND_HOST}:${BACKEND_PORT}";
        proxy_pass http://$backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA fallback for client-side routing (TanStack Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the entry HTML — it references hashed JS/CSS bundles
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        expires -1;
    }

    # Favicons are brand-critical and browsers cache them very aggressively.
    # Keep these paths un-cached so logo updates are picked up after rebuilds.
    location ~* ^/(favicon\.ico|favicon\.png|favicon-32\.png|apple-touch-icon\.png)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        expires -1;
        try_files $uri =404;
    }

    # Cache hashed assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
